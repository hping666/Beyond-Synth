  root: /home/hping/Beyond-Synth
  git_remote: https://github.com/hping666/Beyond-Synth
  eda_knowledge: /home/hping/eda-knowledge
  eda_env: /hdd1/hping/eda/setup/env.sh
  flow_dir: /hdd1/hping/eda/flow
  orfs_dir: /home/hping/OpenROAD-flow-scripts
  results_dir: /home/hping/Beyond-Synth/results

tools:                       # measured 2026-09-12 (Phase 0.1, selfcheck 22/22 + e2e 11/11); dpv_app_ok and vcd2saif stay TBD until Phase 0.6 / 0.7
  dc: {version: W-2024.09-SP5-3, shell: dc_shell, max_cores: 4, seats: 50, home: /hdd1/hping/eda/synopsys/syn/W-2024.09-SP5-3}   # seats: 50 per feature (eda-knowledge 01, DECISIONS 2026-09-14)
  pt: {version: V-2023.12-SP5-4, shell: pt_shell, home: /hdd1/hping/eda/synopsys/prime/V-2023.12-SP5-4}
  primepower: {version: V-2023.12-SP5-4}
  vcformal: {version: Y-2026.03-SP1-1, home: /hdd1/hping/eda/synopsys/vc_formal/Y-2026.03-SP1-1, seq_app_ok: true, seq_workers: 1, seats: 50, dpv_app_ok: true, dpv_license_feature: VC-FORMAL-DPV-ELITE-SH, terminfo: /lib/terminfo}   # DPV verified 2026-09-12 (8-bit multiplier: rewrite proven, bug falsified); the BASE feature fails with FlexNet -5 and the tool falls back to ELITE; console needs the system terminfo
  vcs: {version: Y-2026.03-SP1-1, home: /hdd1/hping/eda/synopsys/vc_formal/Y-2026.03-SP1-1/vcs-mx, vcd2saif: /hdd1/hping/eda/synopsys/syn/W-2024.09-SP5-3/bin/vcd2saif}   # vcd2saif ships with DC; chain verified 2026-09-12
  yosys: {version: "0.63", bin: /home/hping/OpenROAD-flow-scripts/tools/install/yosys/bin/yosys}
  opensta: {version: OpenROAD-26Q1-2754, bin: /home/hping/OpenROAD-flow-scripts/tools/install/OpenROAD/bin/sta}
  orfs: {version: git-df27ce67, dir: /home/hping/OpenROAD-flow-scripts}

libs:                        # measured 2026-09-12; all .db compiled from the ORFS Liberty files; only nangate45 has a Milkyway physical library
  nangate45: {db: /hdd1/hping/eda/libs/nangate45/NangateOpenCellLibrary_typical.db, name: NangateOpenCellLibrary, time_scale: 1.0, liberty: /home/hping/OpenROAD-flow-scripts/flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib, latch_map: /home/hping/OpenROAD-flow-scripts/flow/platforms/nangate45/cells_latch.v, physical_ref_for_spg: /hdd1/hping/eda/libs/nangate45/mw/nangate45, mw_tf: /hdd1/hping/eda/libs/nangate45/mw/nangate45.tf, main: true}
  asap7: {db: /hdd1/hping/eda/libs/asap7/RVT_TT.list, name: asap7sc7p5t_INVBUF_RVT_TT_nldm_211120, time_scale: 1000.0, liberty: null, physical_ref_for_spg: null}
  sky130hd: {db: /hdd1/hping/eda/libs/sky130hd/sky130_fd_sc_hd__tt_025C_1v80.db, name: sky130_fd_sc_hd__tt_025C_1v80, time_scale: 1.0, liberty: /home/hping/OpenROAD-flow-scripts/flow/platforms/sky130hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib, latch_map: /home/hping/OpenROAD-flow-scripts/flow/platforms/sky130hd/cells_latch_hd.v, physical_ref_for_spg: null, dont_use: ["sky130_fd_sc_hd__lpflow_*", sky130_fd_sc_hd__probe_p_8, sky130_fd_sc_hd__probec_p_8]}   # as ORFS DONT_USE_CELLS: multi-power-domain (isolation / level-shifter / kapwr) and probe cells; DC MV-090 otherwise (DECISIONS 2026-09-12)

constraints:                 # one SDC convention for every tool (OpenSTA-native text; the DC copy is rewritten by src/eval/sdc.py); Phase 0.5 decision in DECISIONS
  clock_name: clk
  io_delay_frac: 0.2         # input/output delay = 20% of the period (the convention of the earlier DC-vs-ORFS baselines)
  max_fanout: 20
  driving_cell: {nangate45: BUF_X1, asap7: BUFx2_ASAP7_75t_R, sky130hd: sky130_fd_sc_hd__buf_1}
  output_load: null          # no set_load: identical across tools and libraries (library units differ: fF vs pF)
  clock_gating_style: ""     # extra arguments for set_clock_gating_style before a -gate_clock compile; empty = DC defaults

# ---------- evaluation configurations (commands are assembled by src/eval/templates; only semantic parameters here) ----------
# Ladder as adopted 2026-09-12 (DECISIONS; reports/phase0.md addendum): wire-load mode, nangate45. `synlib` = synthetic
# library: standard (standard.sldb only, the basic rung) or dw (DesignWare Foundation; compile_ultra adds it by itself when
# licensed). `-timing_high_effort_script` is a no-op on DC W-2024.09 and is kept out; the timing-high-effort strategy
# variable exists only in topographical mode and is enabled in H3. E2r is an alias of E3 (same command: one run, two roles).
configs:
  E1:  {tool: dc, compile: "compile", lib: nangate45, clock: phi_main, synlib: standard}
  E1d: {tool: dc, compile: "compile", lib: nangate45, clock: phi_main, synlib: dw, single_flag: designware}
  E2:  {tool: dc, compile: "compile_ultra", lib: nangate45, clock: phi_main, synlib: dw}
  E3:  {tool: dc, compile: "compile_ultra -retime", lib: nangate45, clock: phi_main, synlib: dw}
  E4:  {tool: dc, compile: "compile_ultra -retime -gate_clock", lib: nangate45, clock: phi_main, synlib: dw, main_scoring: true}
  E2r: {alias_of: E3, single_flag: retime}
  E2g: {tool: dc, compile: "compile_ultra -gate_clock", lib: nangate45, clock: phi_main, synlib: dw, single_flag: gate_clock}
  E2_1ns: {tool: dc, compile: "compile_ultra", lib: nangate45, clock_ns: 1.0, synlib: dw}   # RTL-OPT authors' published setting (G5 item 4 (a), user 2026-09-15 item 5): compile_ultra at 1 ns, no retime, no gate clock, DesignWare Foundation as compile_ultra loads it; run on the 34 proven RTL-OPT pairs only
  # decision 2026-09-15 item 4: the settings found in the RTL-OPT authors' released scripts (evaluation_framework/DC/run_dc.tcl, Results/RTL-OPT_DC/*/command.log) on our DC version:
  # plain compile, 0.1 ns, set_max_delay from all inputs to all outputs, dont_retime, register merging off, sequential (timing) area recovery off, flatten after compile; standard synthetic library only (no DesignWare Foundation with plain compile)
  E1_authors: {tool: dc, compile: "set_app_var compile_enable_register_merging false; set_app_var compile_sequential_area_recovery false; set_fix_multiple_port_nets -all -buffer_constants -feedthroughs [all_designs]; set_max_delay -from [all_inputs] -to [all_outputs] 0.1; set_transform_for_retiming [get_cells *] dont_retime; compile; ungroup -all -flatten", lib: nangate45, clock_ns: 0.1, synlib: standard}
  H1:  {tool: dc, compile: "compile_ultra -retime -gate_clock", lib: nangate45, clock_ns: 0.1, synlib: dw, hidden: true}
  H2a: {tool: dc, compile: "compile_ultra -retime -gate_clock", lib: asap7, clock: phi_main_asap7, synlib: dw, hidden: true}
  H2b: {tool: dc, compile: "compile_ultra -retime -gate_clock", lib: sky130hd, clock: phi_main_sky130hd, synlib: dw, hidden: true}
  H3:  {tool: dc, compile: "set_app_var compile_timing_high_effort true; compile_ultra -retime -gate_clock -spg", lib: nangate45, clock: phi_main, synlib: dw, hidden: true}
  H4:  {tool: pt_primepower, input: E4_netlist, lib: nangate45, clock: phi_main, hidden: true}
  H5:  {tool: dc, compile: "compile_ultra -no_autoungroup -gate_clock", lib: nangate45, clock: phi_main, synlib: dw, hidden: true, production_representative: true}
  # Phase 1 knee-point sweeps on the hidden libraries (spec 01 §3, DECISIONS 2026-09-12): the E4 command on asap7 / sky130hd,
  # run only on original designs (never candidates or perturbations; enforced in src/eval/service.py) so that the hidden
  # configurations H2a / H2b keep every record in results/hidden/ (rule 3) while designs.phi_main_ns_<lib> is derived visibly.
  K_asap7:    {tool: dc, compile: "compile_ultra -retime -gate_clock", lib: asap7, clock: sweep, synlib: dw, phase1_knee_only: true}
  K_sky130hd: {tool: dc, compile: "compile_ultra -retime -gate_clock", lib: sky130hd, clock: sweep, synlib: dw, phase1_knee_only: true}
  # Yosys scripts: dfflibmap maps flip-flops to library cells before abc (as in COEVO's script), otherwise stat -liberty
  # leaves the registers unmapped and under-counts area; read_verilog / write_verilog are added by src/eval/yosys.py.
  Y:   {tool: yosys_opensta, script: "synth -top {top}; dfflibmap -liberty {lib}; abc -liberty {lib}; opt_clean -purge; stat -liberty {lib}", lib: nangate45, clock: phi_main, reference: true}
  O0:  {tool: yosys_opensta, script: "synth -top {top}; dfflibmap -liberty {lib}; abc -liberty {lib}; opt_clean -purge; stat -liberty {lib}", lib: nangate45, clock: phi_main, supplementary: true}
  O1:  {tool: yosys_opensta, script: "synth -top {top} -flatten; opt -full; share -aggressive; techmap; opt; dfflibmap -liberty {lib}; abc -liberty {lib}; opt_clean -purge; stat -liberty {lib}", lib: nangate45, clock: phi_main, supplementary: true}   # techmap; opt after share: the muxes `share` creates after synth must be mapped, or write_verilog emits assign expressions OpenSTA cannot read (2026-09-14)
  O2:  {tool: yosys_opensta, script: "synth -top {top} -flatten; opt -full; share -aggressive; techmap; opt; dfflibmap -liberty {lib}; abc -liberty {lib} -script {abc_heavy_script}; opt_clean -purge; stat -liberty {lib}", lib: nangate45, clock: phi_main, supplementary: true}
  # Ycoevo: COEVO's exact evaluation script and OpenSTA setting (coevo/evaluation/ppa.py): flatten + opt -full, zero IO delays,
  # set_max_delay on in->out paths. Supplementary Exp1 column only (DECISIONS 2026-09-12); Y stays the proposal's definition.
  Ycoevo: {tool: yosys_opensta, script: "flatten; proc; opt; fsm; opt; memory; opt; opt -full; techmap; opt; dfflibmap -liberty {lib}; abc -liberty {lib}; opt_clean -purge; stat -liberty {lib}", lib: nangate45, clock: phi_main, supplementary: true, read_sv: true, io_delay_frac: 0.0, sta_max_delay: true}
  abc_heavy_script: "src/eval/templates/abc_heavy.script"   # O2: several resyn2 rounds + dch, deterministic (no randomization)
cktevo_sky130_visible:         # visible layer of the Sky130 sub-experiment (CktEvo's commercial-arm setting)
  compile: "compile_ultra -retime"   # CktEvo publishes "compile_ultra -retime -timing_high_effort_script"; the flag is a no-op on DC W-2024.09, so this equals E3
  lib: sky130hd
  clock: phi_main_sky130hd
  synlib: dw

knee:
  configs: {nangate45: E4, asap7: K_asap7, sky130hd: K_sky130hd}   # configuration used for the sweep on each library (E4 command everywhere)
  periods_ns: {nangate45: [4.0, 2.8, 2.0, 1.4, 1.0, 0.7, 0.5], asap7: [1.0, 0.7, 0.5, 0.35, 0.25, 0.18, 0.13], sky130hd: [10.0, 7.0, 5.0, 3.5, 2.5, 1.8, 1.3]}
  periods_ext_ns: {nangate45: [0.35, 0.25], asap7: [0.09, 0.065], sky130hd: [0.9, 0.65]}   # 2026-09-14 (DECISIONS): two tighter periods, only for designs whose Phi_main is the tightest swept period
  slack_tol: 0.01            # WNS >= -slack_tol * T counts as met
  area_tol: 0.10             # area must not exceed (1 + area_tol) x the loosest-constraint area

noise:
  n_per_type: 4              # 8 for the Exp1 map designs and for every spread / offset design (DECISIONS 2026-09-14, G1.3)
  n_per_type_map_designs: 8
  n_per_type_spread_offset: 8
  text_p1_for_unproven: true # G1.2: designs whose AST perturbations exist but none is proven get text-level P1 renamings (src/noise/rename_text.py)
  types: [P1_rename, P2_reorder, P3_expr, P4_ctrl]
  configs: [E1, E2, E3, E4, H1, H2a, H2b, H5]
  configs_light: [H3]        # only D and one perturbation per type
  k_sigma: 2.0
  k_sigma_sensitivity: [1.0, 2.0, 3.0]
  sigma_median_warn_pct: 5.0 # G1: warn above this median and propose an alternative truncation
  floor_rule: A              # DECISIONS 2026-09-14 (G1.1): t_D = max(k_sigma x sigma_robust, max |delta| over D's own proven perturbations incl. P0, pooled quantile of |delta| of the configuration and metric)
  pooled_quantile: 0.90
  pooled_weighting: design   # DECISIONS 2026-09-14 (human): every design weighs equally in the pooled quantile; the pooled minimum must be insensitive to how many perturbations each design got ('record' = the rejected record-weighted variant, reported as a sensitivity row only)
  quiet_max_abs: 0.001       # floor class: quiet = every |delta| <= 0.1 %; offset = median |delta| > 0.1 % with MAD <= 1e-6 (every perturbation shifted together); spread otherwise
  floor_classes: [quiet, spread, offset]
  pooled_floor_for_missing: true   # G1.2: designs without a measured floor use the pooled minimum with floor_source = pooled; Exp1 map designs must have a measured floor
  materiality: {area: 0.01, power_saif: 0.02, wns: 0.01}   # fixed-threshold sensitivity row for every headline number (WNS as a fraction of the period)
  floor_version: phase4      # DECISIONS 2026-09-14 (G4.3): the floor table is frozen per phase and stamped on every run and diagnosis; phase4 frozen 2026-09-14 after the pre-Phase-4 recomputation (new Exp1 perturbations, knee extension); phase3 rows kept

sim:
  simulator: vcs             # VCS from the VC Formal tree (tools.vcs.home); iverilog is the fallback
  vcs_bash_namespace: true   # compile inside a private mount namespace with bash bound over /bin/sh (VCS's rmapats.sh has bashisms; /bin/sh is dash)
  random_cycles: 20000
  reset_cycles: 10
  seed: 1                    # $random seed of the lock-step harness (deterministic stimulus)
  clock_period_ns: 10        # functional simulation only (no timing is simulated)
  max_latency_offset: 8      # V2 searches constant per-output offsets 0..8 cycles (class c2)
  tb_pass_regex: "Your Design Passed"   # RTLLM self-checking testbenches
  tb_fail_regex: "===Error===|failures|FAIL"
  protocol_rules: TBD        # valid/ready recognition rules (filled in Phase 1 per design set)
  saif_coverage_min: 0.8

equiv:                       # DECISIONS 2026-09-14 (G2, C2.5)
  init_state_zero_no_reset: true   # G2.2: registers without a reset start at zero in V2 and V3, identically for D and the candidate (spec 03 §6)
  v4: {enabled: true, clockless_only: true}   # G2.3: DPV only on modules without a clock port, with the three guardrails of spec 03 §1
  seq_cap_min_by_class: {a: 60, b: 60, c1: 240, c2: 240, d: 240}   # C2.5: class-aware safety caps for candidates (minutes); cap -> inconclusive, reported, never discarded; perturbations keep timeouts.seq_min
  c2_headline: false         # G2.1: proven_sim_only is reported apart from proven and never enters headline numbers
  seq_latency_mapping: true  # G2.1 (b), G5 item 2 (ii) (DECISIONS 2026-09-15): a candidate whose V2 offsets are constant runs SEQ with the outputs asserted at those latencies (map_by_name -input; seq_assert -latency2 k); proven -> `proven` with latency_offset_json non-empty (class c2 enters the map), falsified stays falsified; off -> proven_sim_only as before
  c2_population: false       # spec 03 §2: a latency-mapped (c2) candidate is evaluated at E4 and diagnosed (map object) but never enters the archive, is never accepted and earns no credit until the protocol-recognition rules exist

timeouts:                    # minutes
  dc_small: 20
  dc_medium: 60
  dc_large: 180
  pt: 30
  seq_min: 30
  dpv_min: 30
  sim: 30
  llm_call_sec: 600

queue:                       # LOCKED (concurrency caps); automatic backoff when seats are exhausted
  dc_seats_max: 50           # license ceiling (50 seats measured, DECISIONS 2026-09-14); seats are site-shared; the daemon backs off on exit code 75
  dc_seats_target: 24        # dispatch target for Phases 3-4 (DECISIONS 2026-09-14: 50 only for bulk Phase 5-6 runs on the user's confirmation; never back to 12)
  pt_seats_max: 8            # filled 2026-09-12 (DECISIONS): a PT run takes ~5 s, 100 seats licensed
  vcf_seats_max: 50          # 50 seats per SEQ feature, not shared with DC (eda-knowledge 01; DECISIONS 2026-09-14; was a 4-seat placeholder)
  vcf_seats_target: 24       # dispatch target for Phases 3-4 (single-worker SEQ runs, ~1 core each; restored from the temporary 50 of the multi_pipe_8bit backlog on 2026-09-14 21:45); Phase 5 proofs run in bulk mode at 50 (DECISIONS 2026-09-14 item 2)
  per_design_max: {vcf: 16}  # 2026-09-14 (DECISIONS): fairness, not a cap: at most this many jobs of one design at once in a pool, so that hours-long SEQ runs of one design cannot hold every seat (40 during the temporary 50-seat backlog)
  local_max: 16              # added 2026-09-12 (DECISIONS): sim / yosys / orfs / llm / shell jobs on the 64-core host
  poll_sec: 5                # daemon tick interval
  backoff: {initial_sec: 60, max_sec: 900, factor: 2}
  retries: 1

llm:                         # LOCKED (budgets); the model is filled into `selected` after the Phase 3 calibration
  provider: openai
  api_key_env: OPENAI_API_KEY
  candidates: [gpt-5.6-luna, gpt-5.4-mini, gpt-5.6-terra, gpt-5.4]
  selected: gpt-5.6-luna              # G4 (DECISIONS 2026-09-14): 114 retained per USD, best gains equal to terra / gpt-5.4
  second_model: {model: gpt-5.6-terra, arms: [M, B2], scope: all_phase5_starting_points, budget_usd_estimate: 250}   # model-independence check on the full head-to-head comparison
  excluded: {gpt-5.4-mini: "31 truncated answers, 7.5 calls per retained candidate", gpt-5.4: "cost (4.3 retained per USD)"}
  ablations_model: gpt-5.6-luna
  review_model: gpt-5.6-luna           # M6 review, log summaries (Batch)
  service_tier_search: flex
  service_tier_offline: batch
  reasoning_effort: medium
  max_output_tokens: 20000            # 2026-09-14 (DECISIONS): 3000 truncated 602 of 895 calibration answers, 10000 still cut 8 of 23 gpt-5.4-mini answers (reasoning alone reached 10k); uniform generous limit, the truncation rate is reported per model; a model-call setting, not a budget cap
  temperature: 0.7
  budget_usd:
    total: 1000
    phase3_calibration: 60
    phase4_generation: 40
    phase5_main: 600
    phase5_probe: 120                # G5 item 1 (user, 2026-09-15): the large-design correctness probe of terra and sol; LOCKED
    phase6_ablation: 200
    reserve: 100
  hard_stop_fraction: 0.95           # stop when phase spend reaches 95% of its cap
  prices_usd_per_1m:                 # per service tier, short context, USD per 1M tokens (user-supplied pricing tables 2026-09-12);
    standard:                        # the ledger bills each call at the tier the response reports (flex may fall back to standard),
      gpt-5.6-luna:  {input: 0.20, cached_input: 0.02, cache_write: 0.25, output: 1.20}      # batch for Batch-API calls
      gpt-5.6-terra: {input: 2.00, cached_input: 0.20, cache_write: 2.50, output: 12.00}
      gpt-5.6-sol:   {input: 4.00, cached_input: 0.40, cache_write: 5.00, output: 20.00}      # live page https://developers.openai.com/api/docs/pricing on 2026-09-15 (the user's 5.00 / 0.50 / 30.00 of item 4 differed; corrected per that item); cache write 1.25x input (model page)
      gpt-5.4:       {input: 2.50, cached_input: 0.25, cache_write: null, output: 15.00}      # null: no separate cache-write price, input rate applies
      gpt-5.4-mini:  {input: 0.75, cached_input: 0.075, cache_write: null, output: 4.50}
    flex:
      gpt-5.6-luna:  {input: 0.10, cached_input: 0.01, cache_write: 0.125, output: 0.60}
      gpt-5.6-terra: {input: 1.00, cached_input: 0.10, cache_write: 1.25, output: 6.00}
      gpt-5.6-sol:   {input: 2.00, cached_input: 0.20, cache_write: 2.50, output: 10.00}      # live page 2026-09-15: Flex = 0.5x standard (the user's 2.50 / 0.25 / 15.00 corrected)
      gpt-5.4:       {input: 1.25, cached_input: 0.13, cache_write: null, output: 7.50}
      gpt-5.4-mini:  {input: 0.375, cached_input: 0.0375, cache_write: null, output: 2.25}
    batch:
      gpt-5.6-luna:  {input: 0.10, cached_input: 0.01, cache_write: 0.125, output: 0.60}
      gpt-5.6-terra: {input: 1.00, cached_input: 0.10, cache_write: 1.25, output: 6.00}
      gpt-5.6-sol:   {input: 2.00, cached_input: 0.20, cache_write: 2.50, output: 10.00}      # live page 2026-09-15: Flex = 0.5x standard (the user's 2.50 / 0.25 / 15.00 corrected)
      gpt-5.4:       {input: 1.25, cached_input: 0.13, cache_write: null, output: 7.50}
      gpt-5.4-mini:  {input: 0.375, cached_input: 0.0375, cache_write: null, output: 2.25}
  calibration:
    designs: 5                       # RTLLM 1, RTL-OPT 2, Dr.RTL 2
    seeds: 2
    K: 6
    N: 5
    decision:
      primary_metric: retained_candidates_per_usd
      floor_best_gain_ratio: 0.70    # best retained gain per design >= 70% of the strongest model
      require_c1_or_d_retained: true

design_sets:                 # counts and splits filled in Phase 1; dev contains only ~20 RTLLM designs
  sources:                   # pinned upstream checkouts (Phase 1.1): raw clones in data/sources/ (gitignored), staged copies in data/designs/<suite>/ (scripts/stage_designs.py)
    rtllm:       {url: "https://github.com/hkust-zhiyao/RTLLM", commit: 41b26896e33b536940116a975626455eed3de65e, local: /home/hping/RTLLM, license: MIT}
    drrtl:       {url: "https://github.com/hkust-zhiyao/DR_RTL", commit: 62b95a57223e8fb187d8b8ec1dcb3d193ef20c6b, local: data/sources/Dr_RTL, license: "unspecified (no LICENSE file in the repository)"}
    rtlopt:      {url: "https://github.com/hkust-zhiyao/RTL-OPT", commit: 25e4bbe052f02fde7f34eb8c3e37a7656e7dce20, local: data/sources/RTL-OPT, license: MIT, note: "the paper's anonymous repository (anonymous.4open.science/r/RTL-OPT-20C5) reports repository_expired (HTTP 410, 2026-09-12); this is the authors' public release with 40 pairs"}
    cktevo:      {url: "https://github.com/cure-lab/cktevo", commit: 2f1abe75cc48437378bd8832517048ba64d53149, local: data/sources/cktevo, license: "unspecified at repository level (the OpenCores cores carry their own LGPL/GPL headers)"}
    rtlrewriter: {url: "https://github.com/yaoxufeng/RTLRewriter-Bench", commit: 96639fe67bc8f020c05978ef5028d75fcf6980f2, local: data/sources/RTLRewriter-Bench, license: "unspecified (no LICENSE file in the repository)"}
  suites:                    # keys are the design_id prefixes (rtllm_accu, drrtl_tv80, ...)
    drrtl:     {source: "arXiv:2604.14989 (Dr.RTL) open-sourced designs", count: 20, dev: [], held: [drrtl_DSP, drrtl_LSTM, drrtl_SPI, drrtl_UART, drrtl_aes, drrtl_arm_cpu1, drrtl_arm_cpu2, drrtl_communication, drrtl_controller, drrtl_cpu_fsm, drrtl_datapath, drrtl_i2c, drrtl_pcie, drrtl_router, drrtl_simple_spi, drrtl_ticket_machine, drrtl_tv80, drrtl_vending_machine]}
    rtlopt:    {source: "arXiv:2601.01765 (RTL-OPT); the public release has 40 pairs (the proposal counted 36)", start_from: suboptimal, reference: optimized, count: 40, dev: [], held: [rtlopt_add_sub, rtlopt_adder, rtlopt_adder_carry, rtlopt_adder_select, rtlopt_addr_calcu, rtlopt_alu_64bit, rtlopt_alu_8bit, rtlopt_calculation, rtlopt_comparator, rtlopt_comparator_16bit, rtlopt_comparator_2bit, rtlopt_comparator_4bit, rtlopt_comparator_8bit, rtlopt_decoder_6bit, rtlopt_decoder_8bit, rtlopt_divider_16bit, rtlopt_divider_32bit, rtlopt_divider_4bit, rtlopt_divider_8bit, rtlopt_fsm, rtlopt_fsm_encode, rtlopt_gray, rtlopt_mac, rtlopt_mul, rtlopt_mul_const, rtlopt_mul_subexpression, rtlopt_mult_if, rtlopt_mux_4to1_16bit, rtlopt_mux_4to1_64bit, rtlopt_mux_dead, rtlopt_mux_large, rtlopt_register, rtlopt_saturating_add, rtlopt_selector, rtlopt_sub_16bit, rtlopt_sub_32bit, rtlopt_sub_4bit, rtlopt_sub_8bit, rtlopt_ticket_machine]}
    cktevo:    {source: "arXiv:2603.08718 (CktEvo)", extraction: module_level, target_count: 30, loc_min: 100, closure_loc_max: 3000, max_per_repo: 5, dev: [], held: [cktevo_ethmac__eth_cop, cktevo_ethmac__eth_miim, cktevo_ethmac__eth_rxethmac, cktevo_ethmac__eth_txethmac, cktevo_hsm__G16Inv2SharesDep, cktevo_hsm__G256Inv2Shares5Stages, cktevo_hsm__MixColumns, cktevo_hsm__hsm, cktevo_mem_ctrl__mc_adr_sel, cktevo_mem_ctrl__mc_dp, cktevo_mem_ctrl__mc_obct_top, cktevo_mem_ctrl__mc_rf, cktevo_nn_engine__dualDendRC_H7, cktevo_nn_engine__spikeLayer8_H7, cktevo_nn_engine__spikeNeuron8_H7, cktevo_nn_engine__thresholds_128x4096, cktevo_risc__btb, cktevo_risc__cpu, cktevo_risc__l2_cache_control, cktevo_risc__stall_control_unit, cktevo_sdc_ctrl__sd_cmd_serial_host, cktevo_sdc_ctrl__sd_data_serial_host, cktevo_sdc_ctrl__sdc_controller, cktevo_spi__spi, cktevo_usb__usbf_core, cktevo_usb__usbf_csr, cktevo_usb__usbf_sie_rx, cktevo_vga_enh__vga_curproc, cktevo_vga_enh__vga_wb_master, cktevo_vga_enh__vga_wb_slave], sky130_subset: [cktevo_ethmac__eth_txethmac, cktevo_hsm__hsm, cktevo_mem_ctrl__mc_rf, cktevo_nn_engine__spikeLayer8_H7, cktevo_risc__cpu, cktevo_sdc_ctrl__sdc_controller, cktevo_spi__spi, cktevo_usb__usbf_core]}
    rtllm:     {source: "RTLLM v2.0", count: 50, synthesizable_under_e4: TBD, dev: [rtllm_LIFObuffer, rtllm_accu, rtllm_adder_16bit, rtllm_adder_bcd, rtllm_comparator_3bit, rtllm_comparator_4bit, rtllm_counter_12, rtllm_div_16bit, rtllm_edge_detect, rtllm_fixed_point_adder, rtllm_fsm, rtllm_instr_reg, rtllm_multi_16bit, rtllm_multi_pipe_8bit, rtllm_pulse_detect, rtllm_right_shifter, rtllm_serial2parallel, rtllm_signal_generator, rtllm_traffic_light, rtllm_width_8to16], held: [rtllm_JC_counter, rtllm_LFSR, rtllm_adder_32bit, rtllm_adder_8bit, rtllm_adder_pipe_64bit, rtllm_alu, rtllm_barrel_shifter, rtllm_calendar, rtllm_fixed_point_substractor, rtllm_freq_div, rtllm_freq_divbyeven, rtllm_freq_divbyfrac, rtllm_multi_8bit, rtllm_multi_booth_8bit, rtllm_multi_pipe_4bit, rtllm_parallel2serial, rtllm_pe, rtllm_radix2_div, rtllm_square_wave, rtllm_sub_64bit, rtllm_up_down_counter]}
    rtlrewriter: {source: "arXiv:2409.11414", pairs: TBD, llm_samples: TBD, role: calibration_only}

  split: {dev_count: 20, seed: 1, dev_suite: rtllm, stratify_by: category}   # PLAN 1.4: dev = seeded stratified sample of the synthesizable single-clock RTLLM designs; everything else held
  sky130_subset_count: 8      # PLAN 1.5: CktEvo modules tagged cktevo_sky130 (one per repository first, by size)
  phase5_pool_excludes_exp1: true   # DECISIONS 2026-09-14: the 10 Exp1 designs (map prior, predictor) never serve as Phase 5 starting points
  phase5_excluded: [cktevo_nn_engine__spikeLayer8_H7, cktevo_ethmac__eth_txethmac, cktevo_vga_enh__vga_wb_master, cktevo_mem_ctrl__mc_obct_top, cktevo_spi__spi, drrtl_datapath, drrtl_pcie, drrtl_i2c, rtlopt_ticket_machine, rtlopt_fsm_encode]         # filled by scripts/phase4_sets.py with the Exp1 designs

scale:                       # Phase 5 main-experiment scale; adjustable after G3 (record in DECISIONS)
  starting_points: 30        # G5 decisions (DECISIONS 2026-09-15, item 1): 30 held designs stratified by tier (exp5.tiers); 5 arms x 30 x 3 seeds = 450 luna runs (36 was the M_noscreen-share figure before G5)
  arms: [B0, B1_E4, B2, M, DrRTL_reimpl]   # M_noscreen dropped at G4 (AUROC(Y) 0.748 < screen.auroc_min; DECISIONS 2026-09-14), its budget went to starting points (30 -> 36)
  seeds: 3
  N: 5
  K: 12
  budget:                    # DECISIONS 2026-09-14 (C2.7): equal LLM calls is the primary caliber; DC / VC Formal hours are reported, not budgeted
    primary: equal_llm_calls
    llm_calls_per_run: 60    # = K x N
    k_e4_equiv: 60           # DC-hour equivalent per design (k_e4_equiv x t_E4(D)), reporting only
    efficiency_metric: llm_calls_per_retained_candidate
  drrtl_original_reference: {designs: 5, executor: user_manual_claude_code}
  cktevo_sky130_subexp: {modules: 8, arms: [M, B2], seeds: 1}

search:
  archive_size: 5
  stall_gens: 3
  feedback_depth: 3
  recal_gens: 3
  audit_frac: 0.10
  bandit: {c_ucb: 1.0, softmax_temp: 0.5, arms: [a, b, c1, d, free], init_from_map_prior: true}
  map_prior_file: reports/data/map_prior_phase4.json   # Phase 4 output (scripts/phase4_exp1.py map-prior): per class the E4 absorption probability (prescreen, feedback) and retention rate (bandit pseudo-counts) on the B0 objects; loaded by arm M (verdict feedback) when init_from_map_prior; null disables
  credit: {labels: [retained, tradeoff], by_class: produced}   # C2.1(c): credited by the produced class (M6), not the requested one
  acceptance_envelope: {floor_classes: [spread, offset], n_perturbations: 3, n_min: 2, rung: E4}   # C2.1(d): on spread / offset designs the gain must exceed the envelope of surface perturbations of the candidate itself
  async_generations: true    # C2.6: the next generation is built from the verdicts available; late verdicts update archive, credit and lineage feedback (spec 05 §7)
  gen_wait_sec: 1800         # a generation is due when every candidate of the current one has a verdict, or this long after it was issued
  poll_sec: 30               # the run driver's polling interval for queue verdicts
  job_priority: 4            # equivalence / E4 / envelope jobs issued by a run go before the noise batches (priorities 0-2)
  envelope_types: [P1_text]  # C2.1(d): the acceptance envelope uses text-level renamings of the candidate (no SEQ needed: renamings are equivalent by construction)
  long_proof_first: {classes: [c1, d], design_patterns: [pipe, mult, div], priority_boost: 1}   # DECISIONS 2026-09-14 item 2: on arithmetic designs the (c1)/(d) proofs go first within a generation (issue order + one priority step) so that their tails overlap with the rest
  arms:                      # spec 05 §5 (implementation differences between arms; the driver reads these keys): fitness source, feedback block, floor, credit rule
    M:     {fitness: E4, feedback: verdict, floor: rule_a, credit: retained_tradeoff, prescreen: true, envelope: true}
    B0:    {fitness: Y, feedback: scalar, floor: none, credit: any_gain, prescreen: false, envelope: false}          # literature caliber (EvolVE-style): Yosys + OpenSTA numbers, any positive gain, DC only at the end
    B1_E4: {fitness: E4, feedback: scalar_static, floor: none, credit: any_gain, prescreen: false, envelope: false}  # Phase 5: E4 numbers plus the static complement text
    B2:    {fitness: E4, feedback: scalar, floor: none, credit: any_gain, prescreen: false, envelope: false}         # naive commercial-in-the-loop: E4 numbers, scalar feedback
screen:                      # "screening" = synthesis-rung screening; not part of the main method (DECISIONS 2026-09-14, G3.1)
  candidates_es: [Y]         # Y's AUROC for E4 retention is measured in Phases 3/4
  auroc_min: 0.75
  noscreen_arm: {drop_if_auroc_below_min: true, reallocate_to: starting_points, dropped_at_g4: true, auroc_phase3: 0.748}   # G4: AUROC(Y) 0.748 < auroc_min -> M_noscreen dropped (final AUROC appended when the multi_pipe verdicts complete); Y stays a map column
  e4_cheap_sec: 120
  miss_max: 0.15
  miss_min: 0.05
prescreen:                   # DECISIONS 2026-09-14 (C2.3): classifier-based prescreen, a separate mechanism from screening
  p_min: 0.9                 # produced class with map-prior absorption probability >= p_min ...
  audit_frac: 0.10           # ... is not evaluated with probability 1 - audit_frac and gets immediate feedback with the prior
classify:                    # M6 rule classifier, rules version 2 (DECISIONS 2026-09-14, pre-Phase-4 task a; calibrated on the 60-candidate dev sample)
  rules_version: 2
  d_diff_min: 0.5            # token diff ratio above which a rewrite without (d) evidence is flagged for review (no longer decides (d))
  review_below: 0.7          # confidence below which the LLM review of spec 04 A.2 step 2 would be consulted
  d_depth_ratio: 3.0         # (d) topology evidence: longest combinational path (Yosys ltp -noff, cells) changes by this factor or more
  operator_families:         # (d) operator evidence: a family present in C's RTLIL histogram and absent in D's (gains only; losses are ordinary recoding)
    mul: ["$mul", "$div", "$mod", "$divfloor", "$modfloor", "$pow", "$macc"]
    add: ["$add", "$sub", "$neg", "$alu"]
    shift: ["$shl", "$shr", "$sshl", "$sshr", "$shift", "$shiftx"]
    # memory cells are deliberately absent: Yosys replaces small arrays by register lists depending on the indexing style, not on the buffer organisation (sample #10)
diag:
  fp_jaccard: 0.95           # may be changed after Phase 4 calibration (record in DECISIONS)
  classes: [a, b, c1, c2, d]
  labels: [retained, absorbed, absorbed_identical, duplicate, noise, harmful, tradeoff, fragile, nonequiv, screened_out]   # C2.4 (DECISIONS 2026-09-14)
  absorbed_identical_seq_audit_frac: 0.10   # absorbed_identical needs no simulation or proof for the verdict; 10 % are audited with SEQ
  threshold_rule: noise.floor_rule          # B.2 bands use the rule-A t_D per metric

exp5:                        # Phase 5 (G5 decisions, DECISIONS 2026-09-15; the pool selection is filled by scripts/phase5_sets.py)
  tiers: {medium: 18, small: 6, large: 6}   # starting points by tier: medium = module-level CktEvo and mid-size Dr.RTL / RTL-OPT designs (B0 proven rate non-zero in Phase 4), small = human-written small designs, large = multi-module designs (kept: a zero proven rate there is a result about the LLM)
  projection_reference_tiers:               # the Exp1 designs grouped by tier: reference for the Phase 5 projections by tier (proofs and calls per retained candidate, storage footprint); never Phase 5 starting points (design_sets.phase5_excluded)
    small: [rtlopt_fsm_encode, rtlopt_ticket_machine]
    medium: [cktevo_spi__spi, drrtl_i2c, cktevo_vga_enh__vga_wb_master, cktevo_ethmac__eth_txethmac, cktevo_mem_ctrl__mc_obct_top]
    large: [cktevo_nn_engine__spikeLayer8_H7, drrtl_datapath, drrtl_pcie]
  hidden_scope: {H1: all_e4, H3: all_e4, H5: all_e4, H2a: accepted_and_audit, H2b: accepted_and_audit, H4: accepted_and_audit}   # user 2026-09-15 item 2: H1 / H3 / H5 on every E4-evaluated candidate (+6 GB); the other configurations on accepted candidates and the audit sample (spec 06 §3)
  ladder_on_accepted: phase6                # user 2026-09-15 item 2: the Phase 4 ladder is repeated on the accepted Phase 5 candidates in Phase 6 (in Phase 5 only if ~/.cache is freed, option B)
  correctness_probe:                        # G5 item 1: before Phase 5, terra and sol on the three large Exp1 designs; a model with >= min_proven proven candidates on a design carries the large tier for arms M and B2 (sol never the main model); starts after the prune and the user's review of the B1 prefix (decision 2026-09-15 item 6)
    arm: M                                  # the main method's arm (E4 fitness, verdict feedback, map prior, correctness aids), exp phase5_probe, budget llm.budget_usd.phase5_probe
    models: [gpt-5.6-terra, gpt-5.6-sol]
    designs: [cktevo_nn_engine__spikeLayer8_H7, drrtl_datapath, drrtl_pcie]
    seeds: 2
    K: 6
    N: 5
    min_proven: 5
    budget_usd: 120                         # LOCKED (G5 item 1; a cap recorded from the user's decision, booked as phase phase5_probe in the ledger)
  correctness_aids:                         # G5 item 1, pre-registered for every arm (implemented in src/search/scope.py and driver.py, spec 05)
    scope_limited_rewriting: true           # the prompt names the region to rewrite; the answer returns the full file; unchanged regions verified textually before any tool runs (label scope_violation, one call, no repair)
    scope: {endpoints: 3, multi_module: module, single_module: block}   # region = the module holding the top-k critical endpoints of the parent's (or D's) evaluation on a multi-module design, or the always blocks assigning them on a single-module design; other statement-level items must be unchanged, declarations are free
    repair_attempts: 1                      # one counterexample-guided repair call per candidate for V1 rejections, lock-step mismatches and SEQ counterexamples, counted under the equal-call budget
    repair_failure_types: [rejected, sim_fail, falsified]   # inconclusive / error / scope_violation get no repair
exp1:                        # Phase 4
  b0_designs: {cktevo_held: 5, drrtl_held: 3, rtlopt_held: 2}   # C1 scope (DECISIONS 2026-09-14): human-written RTL only; RTLLM is the out-of-scope contrast
  designs: [cktevo_nn_engine__spikeLayer8_H7, cktevo_ethmac__eth_txethmac, cktevo_vga_enh__vga_wb_master, cktevo_mem_ctrl__mc_obct_top, cktevo_spi__spi, drrtl_datapath, drrtl_pcie, drrtl_i2c, rtlopt_ticket_machine, rtlopt_fsm_encode]                # filled by scripts/phase4_sets.py (deterministic selection, measured floors required)
  candidates_per_design: 30
  b0: {K: 10, N: 5, seed: 1, max_runs_per_design: 4}  # B0 generation per design: K x N = 50 calls (llm.selected, Y-caliber fitness) per run; designs below candidates_per_design proven candidates get top-up runs (next seeds) up to max_runs_per_design (luna's proven rate on human-written multi-module RTL is far below the 75 % of the RTLLM calibration: syntax errors, SEQ counterexamples)
  configs: [E1, E1d, E2, E3, E4, E2g, H1, H2a, H2b, H3, H5, H4]   # E2r removed from every list (same command as E3; DECISIONS 2026-09-14); E2t dropped (no-op flag)
  supplementary: [O0, O1, O2, Ycoevo]
  manual_check_per_class: 40
  manual_check_seed: 1         # PLAN 4.6: seed of the stratified diagnosis sample (phase4_exp1.py diag-sample)

ablations:                   # Phase 6, 30-start subset, 3 seeds
  subset_size: 30
  variants: [no_screen, fixed_es_tau, class_blind_predictor, scalar_feedback, credit_any_gain, no_noise_truncation, no_online_rung_attribution, no_map_prior, fitness_E2, fitness_E1, no_power_dim, no_c1, skeleton_coevo, skeleton_revolution]

reporting:
  cross_tool_tables_allowed_in_paper: true   # confirmed by the user with Viterbi ITS on 2026-09-12 (DECISIONS): Yosys-vs-DC comparisons may be published

retention:                   # approved by the user 2026-09-12 (DECISIONS): results stay append-only, but the tools' own scratch is not a result
  prune_dc_work_after_ingest: true   # remove outputs/dc_work and outputs/mw_design once meta.json is written and the ok record is ingested
  prune_eq_build_after_saif: true    # 2026-09-13 (DECISIONS): the VCS build (csrc/, simv, simv.daidir/) of an equivalence record is scratch once its SAIF exists
  prune_eq_vcd_after_saif: true      # DECISIONS 2026-09-14 (operations 1): the VCD of a record is deleted once its SAIF exists and power was ingested with status ok
  vcd_keep_verdicts: [sim_fail]     # their VCDs are kept for diagnosis; falsified removed 2026-09-14 (user): the lock-step VCD of a falsified record holds no mismatch, the SEQ counterexample is the evidence
  sim_fail_vcd_sample: {frac: 0.05, seed: 1}   # 2026-09-15 amendment (user, verbatim in DECISIONS): of the sim_fail records only this seeded random sample keeps its VCD, at record time and in the tiered prune; the mismatch cycle and signal values stored in the record are the evidence of the repair step and the paper
  vcd_compress_kept: true           # 2026-09-14 (user): kept VCDs are stored gzip-compressed (.vcd.gz, lossless)
  prune_eq_build_nonproven: true    # 2026-09-14 (user): the VCS build of a record that is not proven is scratch as well (rebuildable from the RTL)
  vcd_keep_sample_frac: 0.02        # plus a deterministic 2 % sample (by record hash)
  vcd_to_scratch: true              # future runs: vcd2saif right after the lock-step simulation, the VCD deleted unless kept by the rules above
  keep_scratch_on_failure: true      # failed / eval_failed records keep everything for diagnosis
  # G5 decisions item 5 (ii), 2026-09-15: tiered retention. Full raw artifacts only for accepted candidates (ever in an archive) and the audit
  # sample; every other candidate evaluation keeps the record, the small reports, logs and scripts and loses the regenerable artifacts
  # once the run has applied its verdict (src/eval/retention.py; the driver slims at the final label, scripts/prune_scratch.py --tiered
  # applies the same rule to earlier records on the user's decision). Records and rows are never deleted (rule 5).
  tiered: true
  min_free_gb: 15                    # decision 2026-09-15 item 1: the search driver stops submitting new jobs (LLM calls, equivalence, fitness, envelope, repair) while the root filesystem has less free space; runs pause with status paused_disk and resume when space returns; scripts/status.py warns
  tiered_audit_frac: 0.10            # deterministic sample by candidate id that keeps everything (the hidden layer's rejected-candidate sample, spec 06 §3)
  tiered_dc_delete: [netlist, ddc, saif, inputs_rtl]                          # DC / Yosys records: netlist.v, design.ddc, SAIFs, the RTL copy
  tiered_eq_delete: [vcd, trace, ports, seq_rtdb, seq_learnt, vcs_build, saif]   # equivalence records: VCDs, lock-step trace, port JSONs, VC Formal databases and learnt data, VCS builds, SAIFs
  m6_workdir_after_classification: delete   # the classifier's Yosys workdir of a candidate (features archived in candidates.features_json); D's statistics are computed once per run
