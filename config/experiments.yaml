  vcformal: {version: Y-2026.03-SP1-1, home: /hdd1/hping/eda/synopsys/vc_formal/Y-2026.03-SP1-1, seq_app_ok: true, seq_workers: 1, dpv_app_ok: true, dpv_license_feature: VC-FORMAL-DPV-ELITE-SH, terminfo: /lib/terminfo}   # DPV verified 2026-09-12 (8-bit multiplier: rewrite proven, bug falsified); the BASE feature fails with FlexNet -5 and the tool falls back to ELITE; console needs the system terminfo
  vcs: {version: Y-2026.03-SP1-1, home: /hdd1/hping/eda/synopsys/vc_formal/Y-2026.03-SP1-1/vcs-mx, vcd2saif: /hdd1/hping/eda/synopsys/syn/W-2024.09-SP5-3/bin/vcd2saif}   # vcd2saif ships with DC; chain verified 2026-09-12
